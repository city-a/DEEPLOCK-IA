<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deeplock IA - Pago Seguro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        /* Contenedor principal */
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Botón de compra (inicial) */
        .buy-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            padding: 18px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px -5px rgba(34,197,94,0.4);
        }

        .buy-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(34,197,94,0.6);
        }

        /* Overlay de animación */
        .animation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s;
        }

        .animation-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .zoom-text {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: white;
            text-transform: uppercase;
            font-family: monospace;
            animation: zoomAndFade 1.2s ease-out forwards;
            transform-origin: center;
        }

        @keyframes zoomAndFade {
            0% {
                transform: scale(0.5);
                opacity: 0;
                letter-spacing: 20px;
            }
            40% {
                transform: scale(1.5);
                opacity: 1;
                letter-spacing: 8px;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Formulario de pago (oculto inicialmente) */
        .payment-form-container {
            background: white;
            border-radius: 40px;
            padding: 2rem;
            color: #0f172a;
            margin-top: 2rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            display: none;
            transition: all 0.3s;
        }

        .payment-form-container h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }

        .card-row {
            display: flex;
            gap: 1rem;
        }

        .card-row .form-group {
            flex: 1;
        }

        .pay-submit {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .pay-submit:hover {
            transform: scale(0.98);
        }

        .success-message {
            background: #22c55e;
            color: white;
            padding: 15px;
            border-radius: 30px;
            text-align: center;
            margin-top: 1rem;
            font-weight: bold;
        }

        .error-message {
            background: #ef4444;
            color: white;
            padding: 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <button class="buy-btn" id="buyButton">💳 COMPRAR AHORA</button>
    <div id="paymentForm" class="payment-form-container">
        <h2>🔒 Datos de pago</h2>
        <div class="form-group">
            <label>Número de tarjeta</label>
            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
        </div>
        <div class="card-row">
            <div class="form-group">
                <label>Fecha expiración</label>
                <input type="text" id="expiry" placeholder="MM/AA">
            </div>
            <div class="form-group">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="123" maxlength="3">
            </div>
        </div>
        <div class="form-group">
            <label>Nombre del titular</label>
            <input type="text" id="cardName" placeholder="Como aparece en la tarjeta">
        </div>
        <button class="pay-submit" id="submitPayment">PAGAR AHORA</button>
        <div id="paymentResult"></div>
    </div>
</div>

<script>
    // Elementos
    const buyBtn = document.getElementById('buyButton');
    const overlay = document.createElement('div');
    overlay.className = 'animation-overlay';
    const zoomText = document.createElement('div');
    zoomText.className = 'zoom-text';
    zoomText.innerText = 'DEEPLOCK-IA'; // Mayúsculas blancas
    overlay.appendChild(zoomText);
    document.body.appendChild(overlay);

    const paymentFormDiv = document.getElementById('paymentForm');
    let animationTimeout = null;

    // Función para limpiar overlay
    function removeOverlay() {
        overlay.classList.remove('active');
        // Después de la animación, mostrar formulario
        paymentFormDiv.style.display = 'block';
        // Scroll suave al formulario
        paymentFormDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Evento del botón comprar
    buyBtn.addEventListener('click', () => {
        // Ocultar el botón de compra (opcional)
        buyBtn.style.display = 'none';
        // Activar overlay
        overlay.classList.add('active');
        // Esperar a que termine la animación (1.2s)
        if (animationTimeout) clearTimeout(animationTimeout);
        animationTimeout = setTimeout(() => {
            removeOverlay();
        }, 1200);
    });

    // Simulación de pago (funcional, sin backend real)
    const submitBtn = document.getElementById('submitPayment');
    const cardNumberInput = document.getElementById('cardNumber');
    const expiryInput = document.getElementById('expiry');
    const cvvInput = document.getElementById('cvv');
    const cardNameInput = document.getElementById('cardName');
    const resultDiv = document.getElementById('paymentResult');

    // Formatear número de tarjeta (espacios cada 4)
    cardNumberInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 16) value = value.slice(0,16);
        let formatted = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formatted += ' ';
            formatted += value[i];
        }
        e.target.value = formatted;
    });

    // Formatear fecha MM/AA
    expiryInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 4) value = value.slice(0,4);
        if (value.length >= 3) {
            e.target.value = value.slice(0,2) + '/' + value.slice(2);
        } else {
            e.target.value = value;
        }
    });

    // Validar CVV solo números
    cvvInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0,3);
    });

    submitBtn.addEventListener('click', () => {
        // Validaciones básicas
        const cardNumRaw = cardNumberInput.value.replace(/\s/g, '');
        const expiry = expiryInput.value;
        const cvv = cvvInput.value;
        const name = cardNameInput.value.trim();

        if (cardNumRaw.length !== 16) {
            showMessage('Número de tarjeta inválido (debe tener 16 dígitos)', 'error');
            return;
        }
        if (!/^\d{2}\/\d{2}$/.test(expiry)) {
            showMessage('Fecha de expiración inválida (MM/AA)', 'error');
            return;
        }
        if (cvv.length !== 3) {
            showMessage('CVV inválido (3 dígitos)', 'error');
            return;
        }
        if (name === '') {
            showMessage('Ingresa el nombre del titular', 'error');
            return;
        }

        // Simular procesamiento de pago
        showMessage('Procesando pago...', 'info');
        setTimeout(() => {
            // Simular éxito 90% del tiempo (para demostración)
            const isSuccess = Math.random() > 0.1;
            if (isSuccess) {
                showMessage('✅ ¡Pago exitoso! Recibirás un correo de confirmación.', 'success');
                // Opcional: redirigir o mostrar mensaje de agradecimiento
                setTimeout(() => {
                    alert('Gracias por tu compra. Serás redirigido a la página de inicio.');
                    window.location.href = '/'; // Cambiar si es necesario
                }, 2000);
            } else {
                showMessage('❌ Error en la transacción. Intenta con otra tarjeta.', 'error');
            }
        }, 1500);
    });

    function showMessage(msg, type) {
        resultDiv.innerHTML = `<div class="${type === 'success' ? 'success-message' : 'error-message'}">${msg}</div>`;
        if (type === 'success') {
            // Deshabilitar formulario tras éxito
            submitBtn.disabled = true;
        } else if (type === 'error') {
            setTimeout(() => {
                resultDiv.innerHTML = '';
            }, 4000);
        } else {
            // info
            resultDiv.innerHTML = `<div style="background:#f59e0b; padding:10px; border-radius:30px;">${msg}</div>`;
            setTimeout(() => {
                if (resultDiv.firstChild && resultDiv.firstChild.innerText === msg) resultDiv.innerHTML = '';
            }, 2000);
        }
    }
</script>
</body>
</html>
